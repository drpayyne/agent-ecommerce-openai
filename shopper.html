<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Madras</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Georgia, 'Times New Roman', Times, serif;
        background: #f5f5f5;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        background: #1a1a2e;
        color: #fff;
        padding: 16px 24px;
        font-size: 18px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      #tts-toggle {
        background: none;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 6px;
        color: #fff;
        padding: 6px 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
      }

      #tts-toggle:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .message {
        max-width: 70%;
        padding: 12px 16px;
        border-radius: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
      }

      .message.user {
        align-self: flex-end;
        background: #1a1a2e;
        color: #fff;
      }

      .message.assistant {
        align-self: flex-start;
        background: #fff;
        border: 1px solid #ddd;
      }

      .message.error {
        align-self: flex-start;
        background: #fee;
        border: 1px solid #fcc;
        color: #c00;
      }

      .message-time {
        font-size: 11px;
        color: #999;
        margin-top: 4px;
        align-self: flex-start;
      }

      #input-bar {
        display: flex;
        gap: 8px;
        padding: 16px 24px;
        background: #fff;
        border-top: 1px solid #ddd;
      }

      #input-bar input {
        flex: 1;
        padding: 12px 16px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
      }

      #input-bar input:focus {
        border-color: #1a1a2e;
      }

      #input-bar button {
        padding: 12px 24px;
        background: #1a1a2e;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
      }

      #input-bar button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      #mic-button {
        min-width: 112px;
      }

      #mic-button.recording {
        background: #7a1220;
      }

      #mic-button.processing {
        background: #555;
      }
    </style>
  </head>
  <body>
    <header>
      Madras
      <button id="tts-toggle" title="Toggle voice responses">
        <svg
          id="tts-icon-on"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          style="display: none"
        >
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        <svg
          id="tts-icon-off"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
      </button>
    </header>
    <div id="messages"></div>
    <form id="input-bar">
      <input type="text" id="query" placeholder="Ask about products, stock, or order status..." autofocus />
      <button type="button" id="mic-button">🎤 Speak</button>
      <button id="send-button" type="submit">Send</button>
    </form>

    <script>
      const API_BASE = 'http://localhost:8787';

      const SPEECHMATICS_REALTIME_URL = 'wss://eu.rt.speechmatics.com/v2';
      const SPEECHMATICS_TEMP_KEY = 'SPEECHMATICS_TEMP_KEY';

      const ELEVENLABS_API_KEY = 'ELEVENLABS_API_KEY';
      const ELEVENLABS_VOICE_ID = 'ZF6FPAbjXT4488VcRRnw'; // Amelia https://elevenlabs.io/app/voice-library?voiceId=ZF6FPAbjXT4488VcRRnw
      const ELEVENLABS_MODEL = 'eleven_flash_v2_5';

      const messages = document.getElementById('messages');
      const form = document.getElementById('input-bar');
      const input = document.getElementById('query');
      const sendButton = document.getElementById('send-button');
      const micButton = document.getElementById('mic-button');
      const ttsToggle = document.getElementById('tts-toggle');
      const ttsIconOn = document.getElementById('tts-icon-on');
      const ttsIconOff = document.getElementById('tts-icon-off');
      let conversationId = null;
      let ttsEnabled = false;
      let audioCtx = null;
      let currentSource = null;
      let micState = 'idle'; // idle | recording | processing
      let isSending = false;
      let sttContext = null;
      let sttMediaStream = null;
      let sttSource = null;
      let sttProcessor = null;
      let sttSink = null;
      let sttSession = null;

      function updateControls() {
        sendButton.disabled = isSending || micState !== 'idle';
        micButton.disabled = isSending || micState === 'processing';
        input.disabled = isSending || micState !== 'idle';

        micButton.classList.remove('recording', 'processing');
        if (micState === 'recording') {
          micButton.classList.add('recording');
          micButton.textContent = '■ Stop';
        } else if (micState === 'processing') {
          micButton.classList.add('processing');
          micButton.textContent = 'Transcribing...';
        } else {
          micButton.textContent = '🎤 Speak';
        }
      }

      function setMicState(next) {
        micState = next;
        updateControls();
      }

      function float32ToInt16Buffer(float32Array) {
        const int16Array = new Int16Array(float32Array.length);
        for (let i = 0; i < float32Array.length; i++) {
          const sample = Math.max(-1, Math.min(1, float32Array[i]));
          int16Array[i] = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
        }
        return int16Array.buffer;
      }

      function appendTranscriptTokens(collector, results) {
        if (!Array.isArray(results)) return;

        for (const token of results) {
          const content = token?.alternatives?.[0]?.content;
          if (!content) continue;

          if (token.type === 'punctuation' && collector.length > 0) {
            collector[collector.length - 1] += content;
          } else {
            collector.push(content);
          }
        }
      }

      function createRealtimeSttSession(sampleRate) {
        return new Promise((resolve, reject) => {
          if (!SPEECHMATICS_TEMP_KEY || SPEECHMATICS_TEMP_KEY === 'TEST_TEMP_KEY') {
            reject(new Error('Speechmatics temporary key is not configured'));
            return;
          }

          const ws = new WebSocket(`${SPEECHMATICS_REALTIME_URL}?jwt=${encodeURIComponent(SPEECHMATICS_TEMP_KEY)}`);
          const transcriptParts = [];
          const pendingAudioChunks = [];
          let recognitionStarted = false;
          let finished = false;
          let endRequested = false;
          let lastSeqNo = 0;
          let settled = false;

          const settleResolve = (value) => {
            if (settled) return;
            settled = true;
            resolve(value);
          };

          const settleReject = (error) => {
            if (settled) return;
            settled = true;
            reject(error);
          };

          const flushAudioQueue = () => {
            while (
              pendingAudioChunks.length > 0 &&
              ws.readyState === WebSocket.OPEN &&
              recognitionStarted &&
              !finished
            ) {
              const chunk = pendingAudioChunks.shift();
              ws.send(chunk);
              lastSeqNo += 1;
            }
          };

          const sendEndOfStream = () => {
            if (finished || ws.readyState !== WebSocket.OPEN) return;
            finished = true;
            ws.send(
              JSON.stringify({
                message: 'EndOfStream',
                last_seq_no: lastSeqNo,
              })
            );
          };

          const cleanup = () => {
            if (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING) {
              ws.close();
            }
          };

          ws.onopen = () => {
            ws.send(
              JSON.stringify({
                message: 'StartRecognition',
                audio_format: {
                  type: 'raw',
                  encoding: 'pcm_s16le',
                  sample_rate: sampleRate,
                },
                transcription_config: {
                  language: 'en',
                  operating_point: 'enhanced',
                  enable_partials: false,
                  max_delay: 1,
                  max_delay_mode: 'flexible',
                },
              })
            );
          };

          ws.onmessage = (event) => {
            if (typeof event.data !== 'string') return;

            let message;
            try {
              message = JSON.parse(event.data);
            } catch {
              return;
            }

            if (message.message === 'RecognitionStarted') {
              recognitionStarted = true;
              flushAudioQueue();
              if (endRequested) sendEndOfStream();
              settleResolve({
                pushAudio: (chunk) => {
                  if (finished) return;
                  if (!recognitionStarted || ws.readyState !== WebSocket.OPEN) {
                    pendingAudioChunks.push(chunk);
                    return;
                  }
                  ws.send(chunk);
                  lastSeqNo += 1;
                },
                finish: () => {
                  endRequested = true;
                  flushAudioQueue();
                  if (recognitionStarted) sendEndOfStream();
                },
                completed: new Promise((resolveCompleted, rejectCompleted) => {
                  const endHandler = (msg) => {
                    if (msg.message === 'AddTranscript') {
                      appendTranscriptTokens(transcriptParts, msg.results);
                      return;
                    }

                    if (msg.message === 'Error') {
                      rejectCompleted(new Error(msg.reason || 'Speechmatics realtime error'));
                      cleanup();
                      ws.removeEventListener('message', websocketMessageListener);
                      return;
                    }

                    if (msg.message === 'EndOfTranscript') {
                      const transcript = transcriptParts.join(' ').trim();
                      if (!transcript) {
                        rejectCompleted(new Error('No transcript returned from Speechmatics'));
                      } else {
                        resolveCompleted(transcript);
                      }
                      cleanup();
                      ws.removeEventListener('message', websocketMessageListener);
                    }
                  };

                  const websocketMessageListener = (innerEvent) => {
                    if (typeof innerEvent.data !== 'string') return;
                    try {
                      const msg = JSON.parse(innerEvent.data);
                      endHandler(msg);
                    } catch {
                      /* ignore unparsable message */
                    }
                  };

                  ws.addEventListener('message', websocketMessageListener);

                  ws.addEventListener('error', () => {
                    rejectCompleted(new Error('Speechmatics realtime socket error'));
                  });

                  ws.addEventListener('close', () => {
                    if (!finished) {
                      rejectCompleted(new Error('Speechmatics realtime connection closed unexpectedly'));
                    }
                  });
                }),
              });
            }

            if (message.message === 'Error') {
              settleReject(new Error(message.reason || 'Speechmatics realtime error'));
              cleanup();
            }
          };

          ws.onerror = () => {
            settleReject(new Error('Speechmatics realtime socket error'));
            cleanup();
          };

          ws.onclose = () => {
            if (!settled) {
              settleReject(new Error('Speechmatics realtime connection closed'));
            }
          };
        });
      }

      function stopRealtimeCaptureGraph() {
        if (sttProcessor) {
          sttProcessor.disconnect();
          sttProcessor.onaudioprocess = null;
          sttProcessor = null;
        }
        if (sttSource) {
          sttSource.disconnect();
          sttSource = null;
        }
        if (sttSink) {
          sttSink.disconnect();
          sttSink = null;
        }
        if (sttMediaStream) {
          sttMediaStream.getTracks().forEach((track) => track.stop());
          sttMediaStream = null;
        }
        if (sttContext) {
          sttContext.close();
          sttContext = null;
        }
      }

      async function startRealtimeCapture() {
        sttMediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        sttContext = new AudioContext();
        sttSession = await createRealtimeSttSession(sttContext.sampleRate);

        sttSource = sttContext.createMediaStreamSource(sttMediaStream);
        sttProcessor = sttContext.createScriptProcessor(4096, 1, 1);
        sttSink = sttContext.createGain();
        sttSink.gain.value = 0;

        sttProcessor.onaudioprocess = (event) => {
          if (!sttSession) return;
          const channelData = event.inputBuffer.getChannelData(0);
          sttSession.pushAudio(float32ToInt16Buffer(channelData));
        };

        sttSource.connect(sttProcessor);
        sttProcessor.connect(sttSink);
        sttSink.connect(sttContext.destination);
      }

      async function stopRealtimeCaptureAndTranscribe() {
        if (!sttSession) {
          throw new Error('No active Speechmatics session');
        }

        const activeSession = sttSession;
        sttSession = null;

        stopRealtimeCaptureGraph();
        activeSession.finish();

        return activeSession.completed;
      }

      ttsToggle.addEventListener('click', () => {
        ttsEnabled = !ttsEnabled;
        ttsIconOn.style.display = ttsEnabled ? 'block' : 'none';
        ttsIconOff.style.display = ttsEnabled ? 'none' : 'block';
        if (ttsEnabled) {
          // Create/resume AudioContext on user gesture — this unlocks audio playback
          // so later calls to speakText() work even without a fresh gesture.
          if (!audioCtx) audioCtx = new AudioContext();
          audioCtx.resume();
        } else if (currentSource) {
          currentSource.stop();
          currentSource = null;
        }
      });

      async function speakText(text) {
        if (!ttsEnabled || !text || !audioCtx) return;
        try {
          const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${ELEVENLABS_VOICE_ID}/stream`, {
            method: 'POST',
            headers: {
              'xi-api-key': ELEVENLABS_API_KEY,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              text,
              model_id: ELEVENLABS_MODEL,
              output_format: 'mp3_44100_128',
              voice_settings: { speed: 1 },
            }),
          });
          if (!res.ok) {
            console.warn('TTS request failed:', res.status);
            return;
          }
          const arrayBuffer = await res.arrayBuffer();
          const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
          const source = audioCtx.createBufferSource();
          source.buffer = audioBuffer;
          source.connect(audioCtx.destination);
          source.onended = () => {
            currentSource = null;
          };
          currentSource = source;
          source.start();
        } catch (e) {
          console.warn('TTS playback failed:', e);
        }
      }

      function addMessage(text, role, elapsed) {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.textContent = text;
        messages.appendChild(div);
        if (elapsed !== undefined) {
          const time = document.createElement('div');
          time.className = 'message-time';
          time.textContent = `${elapsed}s`;
          messages.appendChild(time);
        }
        messages.scrollTop = messages.scrollHeight;
      }

      /**
       * Stream the SSE response using fetch + ReadableStream reader.
       *
       * This manually parses the SSE protocol because fetch gives us raw bytes,
       * not parsed events. The server sends messages in the format:
       *   data: "<json-encoded text>"\n\n
       *
       * TCP doesn't guarantee message-aligned reads — a single reader.read()
       * may return half a message, one full message, or several at once. So we
       * maintain a `buffer` of unprocessed text:
       *
       * 1. Append decoded bytes to the buffer
       * 2. Split on '\n' — the SSE delimiter '\n\n' produces an empty string
       *    between the two newlines, which we skip via the startsWith check
       * 3. Pop the last element back into the buffer — it's either an incomplete
       *    line (no trailing '\n' yet) or empty. Either way it's not ready to parse.
       * 4. Process complete lines that start with 'data: '
       */
      async function streamWithFetch(url, bubble) {
        const res = await fetch(url);

        if (!res.ok) {
          const text = await res.text();
          throw new Error(text);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder('utf-8', { stream: true });
        let buffer = '';
        let firstChunk = true;
        let nextEventType = null;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop(); // incomplete line goes back to buffer

          for (const line of lines) {
            // SSE named events: "event: <type>\n" precedes its "data:" line
            if (line.startsWith('event: ')) {
              nextEventType = line.slice(7);
              continue;
            }

            // Skip empty lines and SSE comments
            if (!line.startsWith('data: ')) continue;

            const payload = line.slice(6);

            // Capture server-assigned conversation ID from the named event
            if (nextEventType === 'conversation_id') {
              conversationId = JSON.parse(payload);
              nextEventType = null;
              continue;
            }

            // Server-sent error event — throw so the form-level catch displays it
            if (nextEventType === 'error') {
              nextEventType = null;
              throw new Error(JSON.parse(payload));
            }

            // Reset for unnamed data lines (regular text deltas)
            nextEventType = null;

            if (payload === '[DONE]') return;

            if (firstChunk) {
              bubble.textContent = '';
              firstChunk = false;
            }

            bubble.textContent += JSON.parse(payload);
            messages.scrollTop = messages.scrollHeight;
          }
        }
      }

      /**
       * Stream the SSE response using the browser's built-in EventSource API.
       *
       * EventSource handles SSE parsing, reconnection, and buffering internally —
       * no manual buffer management needed. The tradeoff is it only supports GET
       * requests (which we already use) and offers less control over error handling.
       *
       * Returns a Promise that resolves when the stream ends or rejects on error.
       */
      function streamWithEventSource(url, bubble) {
        return new Promise((resolve, reject) => {
          const source = new EventSource(url);
          let firstChunk = true;

          source.addEventListener('conversation_id', (event) => {
            conversationId = JSON.parse(event.data);
          });

          source.addEventListener('error', (event) => {
            if (event.data) {
              source.close();
              reject(new Error(JSON.parse(event.data)));
            }
            // Connection-level errors (no .data) are handled by source.onerror below
          });

          source.onmessage = (event) => {
            if (event.data === '[DONE]') {
              source.close();
              resolve();
              return;
            }
            if (firstChunk) {
              bubble.textContent = '';
              firstChunk = false;
            }
            bubble.textContent += JSON.parse(event.data);
            messages.scrollTop = messages.scrollHeight;
          };

          source.onerror = () => {
            source.close();
            reject(new Error('EventSource connection failed'));
          };
        });
      }

      // Swap between streamWithFetch and streamWithEventSource here
      // const streamResponse = streamWithFetch;
      const streamResponse = streamWithEventSource;

      async function sendQuery(query) {
        addMessage(query, 'user');
        input.value = '';
        isSending = true;
        updateControls();

        const bubble = document.createElement('div');
        bubble.className = 'message assistant';
        bubble.innerHTML = '<em>thinking</em>';
        messages.appendChild(bubble);

        const timer = document.createElement('div');
        timer.className = 'message-time';
        timer.textContent = '0.00s';
        messages.appendChild(timer);
        messages.scrollTop = messages.scrollHeight;

        const start = performance.now();
        const interval = setInterval(() => {
          timer.textContent = `${((performance.now() - start) / 1000).toFixed(2)}s`;
        }, 100);

        try {
          let url = `${API_BASE}/chat?q=${encodeURIComponent(query)}`;
          if (conversationId) url += `&conversation_id=${encodeURIComponent(conversationId)}`;
          await streamResponse(url, bubble);

          clearInterval(interval);
          const elapsed = ((performance.now() - start) / 1000).toFixed(2);
          timer.textContent = `${elapsed}s`;
          console.log(`[chat] ${elapsed}s`);

          // Speak the assistant response via ElevenLabs TTS
          speakText(bubble.textContent);
        } catch (err) {
          clearInterval(interval);
          const elapsed = ((performance.now() - start) / 1000).toFixed(2);
          timer.textContent = `${elapsed}s`;
          bubble.className = 'message error';
          bubble.textContent = err.message.startsWith('Failed to fetch')
            ? `Failed to connect: ${err.message}`
            : `Error: ${err.message}`;
        } finally {
          isSending = false;
          updateControls();
          input.focus();
        }
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const query = input.value.trim();
        if (!query) return;

        console.log('User query:', query);
        await sendQuery(query);
      });

      micButton.addEventListener('click', async () => {
        try {
          if (micState === 'idle') {
            setMicState('recording');
            await startRealtimeCapture();
            return;
          }

          if (micState === 'recording') {
            setMicState('processing');
            const transcript = await stopRealtimeCaptureAndTranscribe();
            if (!transcript) {
              throw new Error('No speech detected');
            }
            setMicState('idle');
            await sendQuery(transcript);
          }
        } catch (err) {
          stopRealtimeCaptureGraph();
          sttSession = null;
          setMicState('idle');
          addMessage(`Voice input failed: ${err.message}`, 'error');
        }
      });

      updateControls();
    </script>
  </body>
</html>
